[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "syncfusion-a2ui-agent"
version = "0.1.0-preview"
description = "Thin, platform-agnostic orchestration ADK for Syncfusion A2UI agents (built on Google's A2A SDK)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Syncfusion" }]
keywords = ["a2ui", "a2a", "syncfusion", "agent", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
    "google-genai>=1.0,<2.0",
    "openai>=1.40,<2.0",
    "anthropic>=0.30,<1.0",
    "uvicorn>=0.51,<1.0",
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/syncfusion/syncfusion-a2ui-agent"
Repository = "https://github.com/syncfusion/syncfusion-a2ui-agent.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0,<7.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.8,<2.0",
    "build>=1.2,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syncfusion_a2ui_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
]
exclude = [
    "/.git",
    "/.github",
    "/.gitignore",
    "/.gitattributes",
    "/.vscode",
    "/.idea",
    "/examples",
    "/tests",
    "/docs",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_errors = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "attr-defined",
    "import-untyped",
]
files = ["src/syncfusion_a2ui_agent"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]